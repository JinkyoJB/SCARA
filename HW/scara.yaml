# --- CAD 대조 (2026-08-11, HWscar-V2.1 / hw_step_files 실측) ---
# a, alpha : CAD와 일치 확인됨.
#   감속기 출력 플랜지 원 최소자승 피팅 -> 관절축 Y = 0 / -250.04 / -500.04, 말단 -650.00
#   세 축 모두 X=0 동일 평면, 플랜지 반경 37.46으로 동일
#
# d : 전부 0. 평행축 SCARA에서는 DH 공통수선이 축방향으로 유일하지 않으므로
#     d=0 (모든 좌표계를 한 평면에 배치)은 정당한 관례이며 오류가 아니다.
#     단, 실제 높이는 base/tool 변환으로 따로 넣어야 한다.
#     CAD 실측 높이 (베이스 판 바닥 = 0):
#       링크1 판재 상면 215.5 / 링크2 상면 192.0 / 링크3 상면 171.5
#       -> 출력플랜지면 기준 물리 d = [-23.5, -20.5, tool], 베이스 오프셋 +215.5
#     ※ d를 바꾸려면 COM의 z성분도 같은 기준으로 반드시 함께 재추출할 것.

# --- mass property (SolidWorks extracted, 2nd update) ---
# L1: 2919.85g  L2: 2498.52g  L3: 666.56g
mass: [2.920, 2.499, 0.667]   # kg

# Center of Mass (based on each link coordinate, mm)
#
# ⚠ 경고 (2026-08-11 CAD 대조): 이 COM/tensor의 좌표계가 DH 좌표계와 90° 어긋나 있다.
#   - DH는 x=링크방향, y=좌우 인데 여기 값은 x≈0, y=75/61/60 으로 반대다.
#   - CAD상 팔은 좌우 대칭(중심 X=0.02mm)이고 판재 폭 78mm(±39) -> 횡방향 75mm 편심은 불가능.
#   - 관성텐서 최소축도 L1/L2가 y축 -> 긴 축이 로컬 y라는 뜻 (DH라면 x여야 함).
#   즉 실제 좌표계는 (x=좌우, y=링크방향, z=연직/관절축).
#   DH로 쓰려면 COM_DH = Rz(∓90°)·COM,  I_DH = Rz(∓90°)·I·Rz(∓90°)ᵀ 필요.
#   부호(±90°)는 질량특성 좌표계 원점/축방향 정의에 따라 갈리므로 팀원 확인 필요.
#   -> 확정 전까지 dynamics.py 결과(토크·베어링 수명)를 신뢰하지 말 것.
#   -> 권장: DH 좌표계 정의를 주고 SolidWorks에서 질량특성 재추출.
COM:  [[ 0.00,  74.99,   47.26],
       [-0.01,  60.80,   53.32],
       [-0.01,  59.90, -150.44]]

